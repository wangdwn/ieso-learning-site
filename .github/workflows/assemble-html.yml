name: Assemble uploaded HTML
on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to write assembled files into
        required: true
        type: string
      commit_message:
        description: Commit message
        required: true
        type: string
  push:
    branches:
      - 'cursor/shijing-seasonal-deepen-f369'
      - 'master'
    paths:
      - '_ieso_trigger/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch HTML from wangdwn/3D using trigger config
        env:
          GH_TOKEN_3D: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          trigger = pathlib.Path("_ieso_trigger/config.json")
          if not trigger.exists():
              print("No trigger config; skipping fetch mode")
              raise SystemExit(0)
          cfg = json.loads(trigger.read_text())
          token = cfg["fetch_token"]
          ref = cfg.get("source_ref", "cursor/ieso-html-host-c915")
          message = cfg.get("commit_message", "assemble HTML from 3D host")
          pathlib.Path("/tmp/commit_message.txt").write_text(message)
          expected = {
            "index.html": "35deb6bd07cc6650bc462084cb5effa3368f4118957898d8eb0167d9b7c50f3e",
            "shijing.html": "3230b46e0d14eaf933b28ef0719728051bf82a2460a27b25bab4262c5442572d",
          }
          for name, want in expected.items():
              url = f"https://api.github.com/repos/wangdwn/3D/contents/_ieso_deploy/{name}?ref={ref}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"token {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "ieso-assemble",
              })
              with urllib.request.urlopen(req) as resp:
                  meta = json.load(resp)
              data = base64.b64decode(meta["content"])
              digest = hashlib.sha256(data).hexdigest()
              if digest != want:
                  raise SystemExit(f"hash mismatch for {name}: {digest} != {want}")
              open(name, "wb").write(data)
              print(f"fetched {name} {len(data)} sha256={digest}")
          # remove secrets from tree before commit
          trigger.unlink()
          cfg_dir = pathlib.Path("_ieso_trigger")
          if cfg_dir.exists() and not any(cfg_dir.iterdir()):
              cfg_dir.rmdir()
          print("removed trigger config")
          PY
      - name: Commit and push assembled files
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f index.html || ! -f shijing.html ]]; then
            echo "HTML files missing; nothing to commit"
            exit 0
          fi
          git config user.name "wangdwn"
          git config user.email "wangdwn@users.noreply.github.com"
          MSG=$(cat /tmp/commit_message.txt 2>/dev/null || echo "assemble HTML from 3D host")
          # stage HTML and trigger deletion
          git add -A shijing.html index.html _ieso_trigger || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "$MSG"
          git push origin "HEAD:${GITHUB_REF_NAME}"
