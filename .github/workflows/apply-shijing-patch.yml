name: Apply shijing homepage patch

on:
  push:
    branches: [cursor/shijing-nav-c745]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/shijing-nav-c745
      - name: Apply patch if homepage still lacks 诗经 link
        run: |
          set -euo pipefail
          if grep -q 'id="shijing-promo-title"' index.html; then
            echo "Patch already applied"
            exit 0
          fi
          git apply shijing.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "feat: add homepage nav and card link to 诗经指南"
          git push origin cursor/shijing-nav-c745
